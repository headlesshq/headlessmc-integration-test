site_name: 'HeadlessMc integration tests'
site_description: 'HeadlessMc commands and their output, generated from the integration tests'
site_url: 'https://headlesshq.github.io/headlessmc-integration-test/'
repo_name: 'headlesshq/headlessmc-integration-test'
repo_url: 'https://github.com/headlesshq/headlessmc-integration-test'
docs_dir: docs
site_dir: build/site
strict: true

theme:
  name: 'material'
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: 'Source Sans Pro'
    code: 'Source Code Pro'

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
