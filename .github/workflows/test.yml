name: Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

env:
  HMC_VERSION: 3.0.0-RC8

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Download headlessmc ${{ env.HMC_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$HMC_VERSION" --repo headlesshq/headlessmc --pattern headlessmc.jar --dir hmc

      - name: Test
        env:
          HMC_EXECUTABLE: ${{ github.workspace }}/hmc/headlessmc.jar
        run: ./gradlew test

      - name: Upload recordings and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: recordings-${{ matrix.os }}
          path: |
            build/recordings
            build/reports/tests
          if-no-files-found: ignore

  latest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Download latest headlessmc release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo headlesshq/headlessmc --pattern headlessmc.jar --dir hmc

      - name: Test
        env:
          HMC_EXECUTABLE: ${{ github.workspace }}/hmc/headlessmc.jar
        run: ./gradlew test

      - name: Upload recordings and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: recordings-latest
          path: |
            build/recordings
            build/reports/tests
          if-no-files-found: ignore
