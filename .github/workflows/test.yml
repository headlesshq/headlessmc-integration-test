name: Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Download latest headlessmc release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo headlesshq/headlessmc --pattern headlessmc.jar --dir hmc

      - name: Test
        env:
          HMC_EXECUTABLE: ${{ github.workspace }}/hmc/headlessmc.jar
        run: ./gradlew test

      - name: Upload recordings and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: recordings-ubuntu-latest
          path: |
            build/recordings
            build/reports/tests
          if-no-files-found: ignore
