[versions]
assertj = "3.27.6"
jackson = "3.1.4"
junit = "6.1.3"

[libraries]
assertj = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
jackson = { group = "tools.jackson.core", name = "jackson-databind", version.ref = "jackson" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
